<!doctype html>
<!--
  只读 Web 面板的模板（`GET /`）。整份东西由 `panel.rs` 注一次配置再发出去。

  **这里没有数据**：状态全靠页面里的 JS 去拉 `/v1/state`（要 token）。所以这个
  文件里不该出现任何用户信息，加东西时也别加 —— 它是唯一一条**不需要鉴权**的
  路由，拿不到 token 的人看到的就是这个空壳。

  配置只有一处：下面那个 `__CONFIG__` 占位符（颜色 / 状态名 / 组显示名 / 版本）。
-->
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="color-scheme" content="dark" />
<title>SignalHub</title>
<style>
  :root {
    --bg: #0e1116;
    --card: #171b22;
    --line: #232a34;
    --fg: #e6e9ef;
    --dim: #8b929e;
    --lamp: #8b929e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue",
      "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 22px 16px 48px;
  }
  main { max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 8px; margin-bottom: 30px; }
  .brand { font-weight: 600; letter-spacing: .02em; }
  .badge {
    font-size: 11px; color: var(--dim); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 8px;
  }
  .link { margin-left: auto; font-size: 12px; color: var(--dim); }

  /* 灯：和桌面上的灯球同一个语义 —— 颜色 = 状态，动 = 正在干活 */
  .lamp {
    width: 88px; height: 88px; border-radius: 50%;
    background: var(--lamp);
    margin: 4px auto 18px;
    box-shadow: 0 0 0 9px rgba(255, 255, 255, .045);
    transition: background .35s ease;
  }
  .lamp[data-dim="1"] { opacity: .3; box-shadow: none; }
  @media (prefers-reduced-motion: no-preference) {
    .lamp[data-motion="1"] { animation: pulse 1.6s ease-in-out infinite; }
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(.93); opacity: .8; }
  }

  .state { text-align: center; font-size: 20px; font-weight: 600; }
  .message {
    text-align: center; color: var(--dim); margin: 6px 0 0;
    min-height: 1.5em; word-break: break-word;
  }

  .groups { margin-top: 30px; display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px;
  }
  .card-head { display: flex; align-items: center; gap: 8px; }
  .chip {
    font-size: 12px; font-weight: 600; color: #0e1116;
    border-radius: 6px; padding: 2px 7px; white-space: nowrap;
  }
  .name { font-size: 14px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg { margin: 8px 0 0; font-size: 14px; color: #c3c9d4; word-break: break-word; }
  .age { margin-top: 8px; font-size: 12px; color: var(--dim); }

  .empty { text-align: center; color: var(--dim); margin-top: 30px; }

  /* ---- 审批（A4）：只在 CONFIG.approve 为真时出现 ---- */
  .approvals { margin-top: 26px; display: flex; flex-direction: column; gap: 10px; }
  .approvals[hidden] { display: none; }
  .approvals-title { font-size: 12px; color: var(--dim); letter-spacing: .04em; }

  .appr { border-left: 3px solid transparent; }
  .appr[data-danger="1"] { border-left-color: #d0342c; }
  .appr-danger {
    margin-top: 8px; font-size: 13px; color: #ff9a9a;
    border-left: 2px solid #d0342c; padding-left: 8px;
  }
  .appr-detail {
    margin: 8px 0 0; max-height: 132px; overflow: auto;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px; line-height: 1.45; color: #d7d7df;
    white-space: pre-wrap; word-break: break-all;
  }
  .appr-warn { margin-top: 8px; font-size: 12px; color: #e8b84b; }

  .appr-actions { display: flex; gap: 8px; margin-top: 10px; }
  .appr-actions button {
    flex: 1; position: relative; overflow: hidden;
    font: inherit; font-size: 14px; padding: 9px 10px;
    border-radius: 9px; border: 1px solid var(--line);
    background: #1e242e; color: var(--fg); cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .appr-actions button:active { background: #262e3a; }
  .appr-actions .primary { border-color: #2e6b45; background: #16301f; }
  /* 「按住确认」：危险的那条允许按钮要按满 800ms 才生效（和灯上一致） */
  .appr-actions .hold .fill {
    position: absolute; inset: 0; width: calc(var(--hold, 0) * 100%);
    background: rgba(255, 255, 255, .16); pointer-events: none;
  }
  .appr-actions .hold .lbl { position: relative; }
  .appr-actions .narrow { flex: 0 0 42px; color: var(--dim); }

  .appr-reasons { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .appr-reasons[hidden] { display: none; }
  .appr-reasons button {
    font: inherit; font-size: 12px; padding: 6px 10px;
    border-radius: 999px; border: 1px solid var(--line);
    background: #1a1f28; color: #c3c9d4; cursor: pointer;
  }
  .appr-done { margin-top: 8px; font-size: 12px; color: var(--dim); }

  /* 没拿到数据时只留提示：灯和状态行藏起来 —— 挂着一个是空的「…」比不显示更差 */
  body[data-mode="hint"] .lamp,
  body[data-mode="hint"] .state,
  body[data-mode="hint"] .message,
  body[data-mode="hint"] .empty { display: none; }

  .hint {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-top: 26px; color: #c3c9d4; font-size: 14px;
  }
  .hint code {
    background: #0b0e13; border: 1px solid var(--line); border-radius: 6px;
    padding: 1px 6px; font-size: 13px; color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  footer { margin-top: 34px; text-align: center; font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
<main>
  <header>
    <span class="brand">SignalHub</span>
    <span class="badge" id="badge">只读</span>
    <span class="link" id="link"></span>
  </header>

  <div class="lamp" id="lamp" data-dim="1"></div>
  <div class="state" id="state"></div>
  <p class="message" id="message"></p>

  <section class="groups" id="groups"></section>
  <p class="empty" id="empty" hidden></p>

  <section class="approvals" id="approvals" hidden></section>

  <div class="hint" id="hint" hidden></div>

  <footer id="foot"></footer>
</main>

<noscript>
  <p style="color:#8b929e;text-align:center">这个面板要靠一小段 JS 去拉状态，关掉 JS 就只剩这个空壳了。</p>
</noscript>

<script>
"use strict";

// 由 `panel.rs` 注入。**除了这个占位符，页面里没有任何服务端数据。**
const CONFIG = __CONFIG__;

// 页面自己的几句话。**状态名不在这里** —— 那些词和系统通知共用 Rust 那张表
// （`lang::signal_label`），随 CONFIG.labels 一起进来，所以手机上说的和通知里
// 说的是同一句。这里只有这一页自己的界面词。
const WORDS = {
  zh: {
    readonly: "只读",
    approvable: "可审批",
    since: "已持续",
    sessions: "个会话",
    unreachable: "连不上服务",
    badToken: "token 不对",
    title: "SignalHub 面板",
    noToken: "这个页面本身没有数据 —— 数据要带上 token 才拉得到。",
    // 下面这段是**当 HTML 挂上去的**（里面有个 <code>），所以 `&lt;` 得写成实体
    howTo: "在地址后面加上 ?t=&lt;token&gt;，或者从 设置 → 接入 → 只读 Web 面板 里复制完整链接。",
    refresh: "每 1 秒刷新",
    clock: "「已持续」按你这台设备的时钟算",
    // ---- 审批（A4）----
    // 这几个词和灯窗里的那份（`src/lib/i18n.ts`）说的是同一句话。**故意各存一份**：
    // 这个页面是不经构建、直接嵌进二进制的静态模板，让它去读前端那套 i18n 就得
    // 引入一个构建步骤 —— 为一屏字不值得。
    waiting: "等你批准",
    allow: "允许",
    deny: "拒绝",
    hold: "按住 0.8 秒确认",
    tooLong: "这条在面板上看不全，只能拒绝 —— 要放行请回电脑上看",
    reasonUnsafe: "太危险",
    reasonSafer: "换个更安全的做法",
    reasonExplain: "先解释再试",
    reason: "给个理由",
    // 认不出来的键就不画横幅：**不画比画一条错的强**（和灯上同一条规矩）
    danger: {
      delete: "这条会删文件",
      "force-push": "这条会改写远端历史",
      rewrite: "这条会丢掉本地改动",
      sql: "这条会删表 / 删库",
      "pipe-shell": "这条会下载并直接执行脚本",
      disk: "这条会直接写磁盘",
      privilege: "这条会提权",
      permissions: "这条会把权限放开",
    },
  },
  en: {
    readonly: "read-only",
    approvable: "can approve",
    since: "for",
    sessions: "sessions",
    unreachable: "cannot reach the service",
    badToken: "wrong token",
    title: "SignalHub panel",
    noToken: "This page carries no data — it needs a token to fetch the state.",
    howTo: "Append ?t=&lt;token&gt; to the URL, or copy the full link from Settings → Connect → Read-only web panel.",
    refresh: "refreshes every 1s",
    clock: "\"for\" is measured with this device's clock",
    waiting: "waiting for you",
    allow: "Allow",
    deny: "Deny",
    hold: "Hold 0.8s to confirm",
    tooLong: "This one doesn't fit here — you can only deny it. Go back to the computer to allow it.",
    reasonUnsafe: "Too dangerous",
    reasonSafer: "Do it more safely",
    reasonExplain: "Explain first",
    reason: "Add a reason",
    danger: {
      delete: "This deletes files",
      "force-push": "This rewrites remote history",
      rewrite: "This discards local changes",
      sql: "This drops tables / databases",
      "pipe-shell": "This downloads and runs a script",
      disk: "This writes to a disk directly",
      privilege: "This escalates privileges",
      permissions: "This opens up permissions",
    },
  },
};

const w = WORDS[CONFIG.lang] || WORDS.zh;
document.documentElement.lang = WORDS[CONFIG.lang] ? CONFIG.lang : "zh";

const lamp = document.getElementById("lamp");
const stateEl = document.getElementById("state");
const msgEl = document.getElementById("message");
const groupsEl = document.getElementById("groups");
const emptyEl = document.getElementById("empty");
const hintEl = document.getElementById("hint");
const linkEl = document.getElementById("link");
const badgeEl = document.getElementById("badge");
const footEl = document.getElementById("foot");

badgeEl.textContent = CONFIG.approve ? w.approvable : w.readonly;
footEl.textContent = "SignalHub " + CONFIG.version + " · " + w.refresh;

const color = (state) => CONFIG.colors[state] || "#8b929e";
const label = (state) => CONFIG.labels[state] || state;
// 用户改过的组名优先（和灯上一样），其次用服务端算出来的默认名，最后退回原始组名
const groupLabel = (group) =>
  CONFIG.groups[group.name] || group.default_label || group.name;

/// 从「进入这个状态的时刻」算到现在。
///
/// **用的是看的人这台设备的时钟**，所以两台机器的时钟差多少，这个数字就差多少
/// （页脚写了这一句）。刻意不在服务端算：那要么给快照加一个「服务端此刻」的字段
/// （改契约），要么每隔一秒重新拉一次快照 —— 为一行「已持续」都不值当。
///
/// 明显不合理的值（负数、超过一年）返回 `null`，那一行就不显示：宁可不显示，
/// 也不显示一个错的数字。
function ageText(sinceMs) {
  if (!sinceMs) return null;
  const secs = Math.floor((Date.now() - sinceMs) / 1000);
  if (!Number.isFinite(secs) || secs < 0 || secs > 86400 * 365) return null;
  if (secs < 60) return secs + "s";
  const mins = Math.floor(secs / 60);
  if (mins < 60) return mins + "m";
  const hours = Math.floor(mins / 60);
  if (hours < 24) return hours + "h " + (mins % 60) + "m";
  return Math.floor(hours / 24) + "d";
}

function card(group) {
  const el = document.createElement("article");
  el.className = "card";

  const head = document.createElement("div");
  head.className = "card-head";

  const chip = document.createElement("span");
  chip.className = "chip";
  chip.style.background = color(group.aggregate);
  chip.textContent = label(group.aggregate);

  const name = document.createElement("span");
  name.className = "name";
  name.textContent = groupLabel(group);

  head.append(chip, name);
  el.append(head);

  if (group.message) {
    const msg = document.createElement("p");
    msg.className = "msg";
    msg.textContent = group.message;
    el.append(msg);
  }

  const bits = [];
  const age = ageText(group.since_ms);
  if (age) bits.push(w.since + " " + age);
  const count = group.sessions ? group.sessions.length : 0;
  if (count > 0) bits.push(count + " " + w.sessions);
  if (bits.length) {
    const line = document.createElement("div");
    line.className = "age";
    line.textContent = bits.join(" · ");
    el.append(line);
  }

  return el;
}

function render(snap) {
  const agg = snap.aggregate;
  lamp.style.setProperty("--lamp", color(agg));
  lamp.dataset.dim = agg === "offline" || agg === "off" || agg === "stale" ? "1" : "0";
  lamp.dataset.motion = agg === "working" || agg === "thinking" ? "1" : "0";
  stateEl.textContent = label(agg);
  msgEl.textContent = snap.message || "";
  document.title = label(agg) + " · SignalHub";

  groupsEl.replaceChildren();
  const groups = snap.groups || [];
  for (const group of groups) groupsEl.append(card(group));
  emptyEl.hidden = groups.length > 0;
  emptyEl.textContent = label("offline");
}

// ---- 审批（A4）------------------------------------------------------------
//
// **只在 CONFIG.approve 为真时才存在。** 关着的时候这个页面连 `/v1/approvals`
// 都不会去拉 —— 那些详情是命令原文和文件路径，而「只读面板」这个承诺就是靠
// 这里守住的（见 `docs/plan-approval.md` A4）。
//
// 和灯窗那边刻意不一样的一处：**没有自定义理由**。手机上打字本来就难受，而
// 拒绝的理由是给模型看的、要短要准，三个预设已经覆盖了绝大多数情况。

const approvalsEl = document.getElementById("approvals");
const HOLD_MS = 800;
const REASONS = ["unsafe", "safer", "explain"];

// 每一条的开始时刻：`age_ms` 是服务端**拉列表那一刻**算的快照，之后不会自己变，
// 而这一行的用处就是「还要等多久」。和灯窗那边同一套算法。
let startedAt = new Map();
let approvalsSig = "";

function reasonText(key) {
  return { unsafe: w.reasonUnsafe, safer: w.reasonSafer, explain: w.reasonExplain }[key];
}

async function decide(id, decision, reason) {
  const body = reason ? { decision, reason } : { decision };
  try {
    await fetch("/v1/approvals/" + encodeURIComponent(id), {
      method: "POST",
      headers: {
        Authorization: "Bearer " + token,
        "Content-Type": "application/json",
        // 记进审计：这一下是从浏览器点的。**同源请求不会触发预检**，所以这个
        // 自定义头不会把请求变成 OPTIONS（跨源才会）。
        "x-signalhub-source": "web",
      },
      body: JSON.stringify(body),
    });
  } catch (err) {
    /* 网络抖一下：下一轮轮询会把这条重新画出来，用户再点一次就行 */
  }
  pollApprovals();
}

// 危险的那条：按满 800ms 才生效（和灯上一致）。
function holdButton(label, onConfirm) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "hold primary";
  const fill = document.createElement("span");
  fill.className = "fill";
  const text = document.createElement("span");
  text.className = "lbl";
  text.textContent = label;
  btn.append(fill, text);

  let start = 0;
  let raf = 0;
  const stop = () => {
    cancelAnimationFrame(raf);
    btn.style.setProperty("--hold", 0);
  };
  const tick = () => {
    const p = Math.min(1, (performance.now() - start) / HOLD_MS);
    btn.style.setProperty("--hold", p);
    if (p >= 1) {
      stop();
      onConfirm();
      return;
    }
    raf = requestAnimationFrame(tick);
  };

  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    start = performance.now();
    raf = requestAnimationFrame(tick);
  });
  btn.addEventListener("pointerup", stop);
  btn.addEventListener("pointerleave", stop);
  btn.addEventListener("pointercancel", stop);
  // 键盘也要能确认（按住空格），否则这一条在只有键盘的设备上点不动
  btn.addEventListener("keydown", (e) => {
    if ((e.key === " " || e.key === "Enter") && !e.repeat) {
      e.preventDefault();
      start = performance.now();
      raf = requestAnimationFrame(tick);
    }
  });
  btn.addEventListener("keyup", stop);
  btn.setAttribute("aria-label", label + " · " + w.hold);
  btn.title = w.hold;
  return btn;
}

function plainButton(label, cls, onClick) {
  const btn = document.createElement("button");
  btn.type = "button";
  if (cls) btn.className = cls;
  btn.textContent = label;
  btn.addEventListener("click", onClick);
  return btn;
}

function approvalCard(a) {
  const el = document.createElement("article");
  el.className = "card appr";
  el.dataset.id = a.id;
  const danger = a.danger ? w.danger[a.danger] : null;
  if (danger) el.dataset.danger = "1";

  const head = document.createElement("div");
  head.className = "card-head";
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.style.background = "#8b929e";
  chip.textContent = a.tool || "?";
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = a.session || "";
  const age = document.createElement("span");
  age.className = "appr-age age";
  age.textContent = w.waiting + " " + (ageText(startedAt.get(a.id)) || "");
  head.append(chip, name, age);
  el.append(head);

  if (danger) {
    const banner = document.createElement("div");
    banner.className = "appr-danger";
    banner.textContent = danger;
    el.append(banner);
  }

  const detail = document.createElement("pre");
  detail.className = "appr-detail";
  detail.textContent = a.detail || "";
  el.append(detail);

  // 看不全就不给放行 —— 规则在服务端挡着（`Registry::decide`），这里只是不给它
  // 一个点了没反应的地方。
  if (a.allowable === false) {
    const warn = document.createElement("div");
    warn.className = "appr-warn";
    warn.textContent = w.tooLong;
    el.append(warn);
  }

  const actions = document.createElement("div");
  actions.className = "appr-actions";
  if (a.allowable !== false) {
    actions.append(
      danger
        ? holdButton(w.allow, () => decide(a.id, "allow"))
        : plainButton(w.allow, "primary", () => decide(a.id, "allow")),
    );
  }
  actions.append(plainButton(w.deny, "", () => decide(a.id, "deny")));

  const reasons = document.createElement("div");
  reasons.className = "appr-reasons";
  reasons.hidden = true;
  for (const key of REASONS) {
    reasons.append(plainButton(reasonText(key), "", () => decide(a.id, "deny", key)));
  }
  const toggle = plainButton("▾", "narrow", () => {
    reasons.hidden = !reasons.hidden;
  });
  toggle.title = w.reason;
  toggle.setAttribute("aria-label", w.reason);
  actions.append(toggle);
  el.append(actions, reasons);
  return el;
}

function rebuildApprovals(list) {
  approvalsEl.replaceChildren();
  const title = document.createElement("div");
  title.className = "approvals-title";
  title.textContent = w.waiting + " · " + list.length;
  approvalsEl.append(title);
  for (const a of list) approvalsEl.append(approvalCard(a));
}

function renderApprovals(list) {
  const sig = list.map((a) => a.id).join("|");
  if (sig !== approvalsSig) {
    approvalsSig = sig;
    startedAt = new Map(list.map((a) => [a.id, Date.now() - (a.age_ms || 0)]));
    rebuildApprovals(list);
  } else {
    // 结构没变就**别重建 DOM** —— 用户可能正按着那个「按住确认」的按钮，
    // 或者刚展开理由。只把「等了多久」往前推。
    for (const el of approvalsEl.querySelectorAll(".appr")) {
      const age = el.querySelector(".appr-age");
      const since = startedAt.get(el.dataset.id);
      if (age && since) age.textContent = w.waiting + " " + (ageText(since) || "");
    }
  }
  approvalsEl.hidden = list.length === 0;
}

async function pollApprovals() {
  if (!CONFIG.approve) return;
  try {
    const res = await fetch("/v1/approvals", {
      headers: { Authorization: "Bearer " + token },
      cache: "no-store",
    });
    if (!res.ok) return;
    const data = await res.json();
    renderApprovals(data.approvals || []);
  } catch (err) {
    /* 连不上就维持现状：下一轮再说 */
  }
}

function showHint(headline, body) {
  document.body.dataset.mode = "hint";
  hintEl.hidden = false;
  hintEl.replaceChildren();
  const strong = document.createElement("p");
  strong.style.margin = "0 0 6px";
  strong.textContent = headline;
  hintEl.append(strong);
  if (body) {
    const p = document.createElement("p");
    p.style.margin = "0";
    p.innerHTML = body; // 只有这一处用 innerHTML，内容是本地常量（含一个 <code>）
    hintEl.append(p);
  }
}

const token = new URLSearchParams(location.search).get("t");
const url = "/v1/state";

let timer = null;
let failures = 0;

async function poll() {
  try {
    const res = await fetch(url, {
      headers: { Authorization: "Bearer " + token },
      cache: "no-store",
    });
    // token 不对就别再问了 —— 每秒钟问一次一个明确拒绝你的端点，既没意义又
    // 会让服务端日志一直在动。
    if (res.status === 401 || res.status === 403) {
      if (timer) clearInterval(timer);
      linkEl.textContent = w.badToken;
      showHint(w.badToken, w.howTo);
      return;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    failures = 0;
    linkEl.textContent = "";
    hintEl.hidden = true;
    delete document.body.dataset.mode;
    render(await res.json());
    // **串行地等**：这两次都是本地几 KB 的请求，串起来一秒钟绰绰有余，
    // 而并发的话「审批还没回来、状态先画出来」会出现半秒的错位。
    await pollApprovals();
  } catch (err) {
    failures += 1;
    // 抖一下就报错太吵：连着两次拉不到才说（应用可能正好在重启）
    if (failures >= 2) linkEl.textContent = w.unreachable;
  }
}

if (!token) {
  linkEl.textContent = w.badToken;
  showHint(w.noToken, w.howTo);
} else {
  poll();
  timer = setInterval(poll, CONFIG.refresh_ms || 1000);
}

// 页脚那句「按设备时钟算」：只有真的显示了「已持续」才有必要说
footEl.textContent += " · " + w.clock;
</script>
</body>
</html>
