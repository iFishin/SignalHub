[package]
# **不叫 `signalhub`**，尽管另外两个名字都叫它。Tauri 不允许 sidecar 和包同名
# （「Cannot define a sidecar with the same name as the Cargo package name」），
# 而我们要把 CLI 作为 sidecar 打进包里（见 tauri.conf.json 的 `externalBin`）。
# 包名本身没有被任何二进制用上 —— 两个 bin 都是显式命名的。
name = "signalhub-desktop"
version = "0.3.3"
description = "Desktop floating status light for AI agents and any other program"
authors = ["iFishin"]
license = "MIT"
edition = "2024"
# MSRV。**这个值是从依赖图里量出来的，不是拍的**：把 `cargo metadata` 里每个包的
# `rust_version` 取最大值，最高的是 Tauri 一家（tauri / tauri-build / tauri-codegen /
# tauri-macros / muda，都是 1.90）。edition 2024 本身只要 1.85，我们自己用的
# let-chain 要 1.88 —— 都被依赖压过去了。
#
# 声明它有两个实际作用：**别人用旧工具链构建时会得到一句「需要 1.90」而不是一屏
# 语法错误**；而且 edition 2024 带来 MSRV 感知的依赖解析，cargo 会优先挑满足这个
# 版本的依赖，而不是挑最新的。
#
# ⚠️ 它只对**当前锁定**的这批依赖成立。`cargo update` 之后某个依赖把 MSRV 抬上去，
# 这个值就成了谎 —— 所以真要动依赖，顺手重跑一次上面那句话。
rust-version = "1.90"
# 这个包里有两个二进制：app 和 CLI。两个都叫 signalhub 会冲突，而 app 的名字
# 用户看不到（通过 .app 启动），CLI 的名字却要写进智能体的 hook 配置里，所以
# 让给 CLI。default-run 让 `cargo run`（也就是 `tauri dev`）选 app 那个。
default-run = "signalhub-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "signalhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "signalhub-app"
path = "src/main.rs"

# src/bin/signalhub.rs 由 cargo 自动发现，产出用户实际调用的 `signalhub` 命令。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 记住悬浮窗位置；尺寸由程序自己管（见 lib.rs 的 apply_window_size），
# 所以只用它存位置，不用它存尺寸。
tauri-plugin-window-state = "2"
# 配置的导入 / 导出要选文件。**只在 Rust 侧拿路径，读写和校验都在 Rust** ——
# 导入必须过 `validate_settings` → `clamped()` 那条路，不能让前端拿到文件内容
# 再自己塞进 `set_settings`。
tauri-plugin-dialog = "2"
# 需要你注意时弹原生通知 —— 灯是被动的，你不盯着屏幕它就白搭。
tauri-plugin-notification = "2"
# 多开会让端口和状态文件互相打架，所以只允许一个实例。
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# 全局快捷键是「点击穿透」模式唯一的可靠逃生通道。
tauri-plugin-global-shortcut = "2"
# 自动更新。**签名用的是 Tauri 自己的密钥对**（不是 Apple / Windows 证书），
# 校验的是「这个包确实是我们发的」，不是「Apple 认识我们」—— 所以没有证书也能做。
#
# ⚠️ 关掉了默认的 `zip` feature，这一条必须解释清楚（`default-features = false`）：
# 那个 feature 会拉进 `dep:zip`（Windows 装更新时解包用），而它要求 `zip = "^4"`
# —— 2026-08 的 RUSTSEC-2025-0168（解包时路径规范化不当，可任意写文件）之后，
# crates.io 上**所有 zip ≤ 9.0.2 都被 yank 了**，只剩 9.0.3 / 9.0.4，`^4` 无解，
# 带上这个 feature 连依赖都解析不出来。
#
# 好在 macOS 的更新包 `.app.tar.gz` 走的是 `flate2` + `tar`，而这两个在插件里是
# **非可选**依赖，和这个 feature 无关 —— 所以 macOS 那条路完整可用。
#
# 另外两个平台**不是「都被 yank 卡住」**，别把话说错：
#   - Windows：更新包就是 `zip` 那种，没有这个 feature 装不了 —— 上游这关过不去。
#   - Linux：`linux-x86_64-appimage` 指的是**没压缩的 ELF AppImage**（查过 v0.2.4
#     的实际产物），那条路走得通；但 deb 装的那份是靠 `dpkg -i` 提权的（普通用户
#     跑不动），而且两条路都没在真机验过 —— 所以先不开。
# 判据是 `update::SUPPORTED`（只有 macOS）。等有人能收 Linux 的验收，改那一行即可。
tauri-plugin-updater = { version = "2", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 直接用 tauri::async_runtime::spawn 起 sweep 和 HTTP 任务；tokio 由 Tauri 内置。
# 锁用 std::sync::Mutex —— 临界区都是内存操作，没有 I/O 跨越 await。
tokio = { version = "1", features = ["time", "net", "io-util", "macros", "rt-multi-thread", "sync"] }
# getrandom 已在 Tauri 的依赖树里，复用版本可以避免重复编译
getrandom = "0.3"
# CLI 的 HTTP 客户端（app 侧发 webhook 也用它）。
# 关掉默认的 gzip 但**必须留 rustls** —— webhook 目标（ntfy / Slack）都是
# HTTPS。选 rustls 而不是 native-tls 是因为后者在 Linux 上要系统 libssl，
# 跨平台构建会多一道坎。
ureq = { version = "3", default-features = false, features = ["rustls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# **别去掉这一行。** 它不只是省体积，还担着两件事：
#
# 1. 库里那 55 处 `.expect("... poisoned")` 全靠它成立。`abort` 不展开栈，所以
#    锁**永远不会中毒** —— 那些「中毒了」的分支是构造上不可达的。改成 unwind
#    之后它们会变成活的，而且真走到那一步时只会连环 panic（已经出过错了，后面
#    每一次加锁都再炸一次），比直接退出更难查。
# 2. wry / tao 会从 Objective-C 回调里调回 Rust。让 panic 展开着穿过那些 C 帧是
#    UB，`abort` 从根上避免了这一类。
#
# 代价是**进程会静默消失**：灯球没有 Dock 图标、也没有窗口，用户只看到圆点没了。
# 所以配套装了 `install_panic_hook`（见 lib.rs）—— 崩了要留下一条记录，让
# 「为什么不见了」有得查。
panic = "abort"
strip = true
