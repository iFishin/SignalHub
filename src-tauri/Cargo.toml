[package]
# **不叫 `signalhub`**，尽管另外两个名字都叫它。Tauri 不允许 sidecar 和包同名
# （「Cannot define a sidecar with the same name as the Cargo package name」），
# 而我们要把 CLI 作为 sidecar 打进包里（见 tauri.conf.json 的 `externalBin`）。
# 包名本身没有被任何二进制用上 —— 两个 bin 都是显式命名的。
name = "signalhub-desktop"
version = "0.2.0"
description = "Desktop floating status light for AI agents and any other program"
authors = ["iFishin"]
license = "MIT"
edition = "2024"
# 这个包里有两个二进制：app 和 CLI。两个都叫 signalhub 会冲突，而 app 的名字
# 用户看不到（通过 .app 启动），CLI 的名字却要写进智能体的 hook 配置里，所以
# 让给 CLI。default-run 让 `cargo run`（也就是 `tauri dev`）选 app 那个。
default-run = "signalhub-app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "signalhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "signalhub-app"
path = "src/main.rs"

# src/bin/signalhub.rs 由 cargo 自动发现，产出用户实际调用的 `signalhub` 命令。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# 记住悬浮窗位置；尺寸由程序自己管（见 lib.rs 的 apply_window_size），
# 所以只用它存位置，不用它存尺寸。
tauri-plugin-window-state = "2"
# 需要你注意时弹原生通知 —— 灯是被动的，你不盯着屏幕它就白搭。
tauri-plugin-notification = "2"
# 多开会让端口和状态文件互相打架，所以只允许一个实例。
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# 全局快捷键是「点击穿透」模式唯一的可靠逃生通道。
tauri-plugin-global-shortcut = "2"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 直接用 tauri::async_runtime::spawn 起 sweep 和 HTTP 任务；tokio 由 Tauri 内置。
# 锁用 std::sync::Mutex —— 临界区都是内存操作，没有 I/O 跨越 await。
tokio = { version = "1", features = ["time", "net", "io-util", "macros", "rt-multi-thread"] }
# getrandom 已在 Tauri 的依赖树里，复用版本可以避免重复编译
getrandom = "0.3"
# CLI 的 HTTP 客户端（app 侧发 webhook 也用它）。
# 关掉默认的 gzip 但**必须留 rustls** —— webhook 目标（ntfy / Slack）都是
# HTTPS。选 rustls 而不是 native-tls 是因为后者在 Linux 上要系统 libssl，
# 跨平台构建会多一道坎。
ureq = { version = "3", default-features = false, features = ["rustls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# **别去掉这一行。** 它不只是省体积，还担着两件事：
#
# 1. 库里那 55 处 `.expect("... poisoned")` 全靠它成立。`abort` 不展开栈，所以
#    锁**永远不会中毒** —— 那些「中毒了」的分支是构造上不可达的。改成 unwind
#    之后它们会变成活的，而且真走到那一步时只会连环 panic（已经出过错了，后面
#    每一次加锁都再炸一次），比直接退出更难查。
# 2. wry / tao 会从 Objective-C 回调里调回 Rust。让 panic 展开着穿过那些 C 帧是
#    UB，`abort` 从根上避免了这一类。
#
# 代价是**进程会静默消失**：灯球没有 Dock 图标、也没有窗口，用户只看到圆点没了。
# 所以配套装了 `install_panic_hook`（见 lib.rs）—— 崩了要留下一条记录，让
# 「为什么不见了」有得查。
panic = "abort"
strip = true
