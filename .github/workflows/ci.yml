name: CI

# 三个平台各跑一遍 `cargo test` + 前端构建。
#
# 存在的理由很具体：这个项目声称跨平台，但平台相关的代码（`#[cfg(windows)]`、
# `#[cfg(unix)]`）在开发机上**根本编不进去**，所以它们从来没被编译过。macOS 上
# 全绿不代表 Windows 上能编过 —— 而这类错误（少一个 import、用了只在一个平台
# 存在的 API、`.exe` 后缀没处理）恰恰是最容易犯、又最难在自己机器上发现的。
#
# 前端一起跑：`npm run build` 里含 `tsc`，类型错误三平台一样，但顺手跑不花时间。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      # 一个平台挂了也让别的跑完 —— 想知道的是「哪几个平台有问题」，
      # 而不是「第一个出错的是哪个」
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      # v5 起这些 action 自己跑在 Node 24 上（v4 是 Node 20，GitHub 已经标了弃用并在
      # 强行顶上 24 —— 与其等它哪天真的不兼容，不如写明白）。这里都取当前大版本，
      # 也顺带拿到 v6 / v7 的安全改动（checkout 把凭据挪出 `.git/config`、
      # 挡住 `pull_request_target` 下的 fork 检出）。
      #
      # 升级时逐个对过：我们没用 `registry-url`，所以 setup-node v7 去掉
      # `NODE_AUTH_TOKEN` 那一下与我们无关；`package.json` 里也没有 `packageManager`
      # 字段，所以 v5 起那个「自动开缓存」不会和我们显式写的 `cache: npm` 打架。
      - uses: actions/checkout@v7

      # tauri 在 Linux 上要链 webkit2gtk / gtk，缺了连 `cargo test` 都编不过
      - name: 安装 Linux 上编译 tauri 需要的系统库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential curl wget file

      - uses: actions/setup-node@v7
        with:
          # 构建用的 Node。它和 action 自己跑在哪个 Node 上是两回事（那个由 v7
          # 定），但两边都停在 24 —— 免得以后有人对着一处 24、一处 22 猜哪个作数。
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 前端类型检查与构建
        run: npm run build

      # 前端单测。目前只覆盖**与 Rust / CSS 有「必须逐字一致」契约**的纯函数：
      # `lib/lampSort.ts`（置顶排序，对 Rust 的 `visible_groups`）和 `lib/lampStyle.ts`
      # （形状特判、动画时长，对 `lamp.css`）。这类逻辑靠类型系统盯不住，只能靠断言。
      - name: 前端单测
        run: npm test

      # `tauri-build` 在**构建脚本阶段**就校验 `bundle.externalBin` 里的文件在不在，
      # 所以 `cargo test` 之前必须先把 sidecar 放好 —— 哪怕测试根本不碰它。
      #
      # `--debug` 让脚本走 debug 构建：测试本来就是 debug，跟着走省掉一次 release
      # 编译。
      - name: 暂存 CLI sidecar
        run: node scripts/stage-cli.mjs --debug

      # 【临时诊断，查完就删】Windows 上测试二进制一本正经地起不来（0xc0000139
      # STATUS_ENTRYPOINT_NOT_FOUND），而且**删掉全部缓存冷构建也一样**。这一步
      # 抓三样事实：exe 依赖哪些 DLL、各 DLL 会从哪解析到、直接跑一次它的退出码
      # —— dumpbin 找猎物走 vswhere，别硬编码 VS 的安装目录（镜像上装的是哪 year
      # 心里没数）。
      - name: 诊断：载不动的测试二进制
        if: runner.os == 'Windows'
        run: |
          Write-Host "===== 先把测试二进制编出来（--no-run，测试一步失败与此步骤成败分开看）"
          cargo test --manifest-path src-tauri/Cargo.toml --no-run
          $exe = (Get-ChildItem src-tauri/target/debug/deps/signalhub_lib-*.exe |
                  Select-Object -First 1).FullName
          Write-Host "===== exe = $exe"
          if (-not $exe) {
            Write-Host "target/debug/deps 下根本没有 signalhub_lib 的 exe！"
            Get-ChildItem src-tauri/target/debug/deps -Filter *.exe | ForEach-Object { Write-Host $_.Name }
            exit 0
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbinRaw = (& $vswhere -latest -products * -requires `
              Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1)
          $dumpbin = $dumpbinRaw.Trim()
          Write-Host "===== 直接跑一次"
          $p = Start-Process -FilePath $exe -ArgumentList "--list" -NoNewWindow -PassThru -Wait
          Write-Host ("exit = 0x{0:x}" -f $p.ExitCode)
          Write-Host "===== 本 exe 依赖的 DLL"
          & $dumpbin /dependents $exe | Select-String "^\s+\S+\.dll" | ForEach-Object { $_.Line }
          Write-Host "===== 每个 DLL 会从哪解析（where.exe 的第一行命中即加载来源）"
          (& $dumpbin /dependents $exe | Select-String "^\s+\S+\.dll\s*$" -AllMatches).Matches |
            ForEach-Object { $dll = $_.Value.Trim()
              Write-Host "-- $dll"
              $hit = (cmd /c "where $dll 2>nul") | Select-Object -First 1
              Write-Host "   -> $hit"
            }
          exit 0

      - name: Rust 测试（lib + CLI）
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # clippy **三平台都跑**，理由和 `cargo test` 一字不差：`#[cfg(windows)]` /
      # `#[cfg(unix)]` 的代码在开发机上根本编不进去，只在 macOS 上跑等于没覆盖。
      #
      # `-D warnings` 而不是「看一眼输出」：不清零的话，下一个真正的问题会被淹没在
      # 已有的噪音里 —— 这个仓库攒了 4 处警告很久没人管，正是这么来的。
      #
      # **基线是 0**：加这条之前先把那 4 处清掉了（两个手写的 `Default` 改成
      # `#[default]`、一处文档注释后面多空了一行、一处测试里的字段赋值），
      # 所以任何新警告都会让 CI 立刻变红，而不是等到某天有人想起来数一遍。
      - name: Clippy（警告即失败）
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
