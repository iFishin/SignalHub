name: Release

# 打一个 `v` 开头的 tag 就出四个平台的安装包。
#
# 为什么必须是四个 runner 而不是一台机器：**Tauri 不能交叉编译**。macOS 的
# `.app` / `.dmg` 只能在 macOS 上打，Windows 的 `-setup.exe` 只能在 Windows 上打，
# Linux 的 `.deb` / `.AppImage` 只能在 Linux 上打。所以「一次出多平台安装包」唯一
# 的路子是矩阵：每个平台各跑一台，产物汇到同一个 Release 里。
#
# Linux 那份**标 beta**（红线）：没在真机/真发行版上长期跑过，透明和置顶在 Wayland
# 下还可能得退回 X11 —— 用户能看到的那段说明在 `.github/release-body.md` 里。
#
# 现在**没有代码签名**（见 README 的「安装」一节）。macOS 上第一次打开会被 Gatekeeper
# 拦，Windows 上会被 SmartScreen 拦一道 —— 绕法写在 `.github/release-body.md` 里，
# 那份说明会被塞进发布页，用户看得到。
# 以后拿到证书，在下面 `tauri-action` 那一步前面补 codesign / notarytool / signtool
# 三步即可，其余不用动。
#
# ---- 自动更新：macOS + Windows 安装版，Linux / portable 手动（2026-11）--------
#
# 配置在 src-tauri 的四处：`Cargo.toml` 的依赖、`lib.rs` 的 `.plugin()` 与三条命令、
# `tauri.conf.json` 的 `plugins.updater` + `createUpdaterArtifacts`、
# `capabilities/default.json` 的 `updater:default`。客户端判据是 `update::supported()`
# （运行时判：macOS 恒真，Windows 看 `bundle_type() == Nsis`，其余假）。
#
#   - **macOS + Windows 安装版：可用。** macOS 更新包 `.app.tar.gz` 只用 flate2 + tar；
#     Windows 更新包是**裸 `setup.exe`**（见 `latest.json` 的 `windows-x86_64`），
#     插件 `extract_exe` 直接认 PE 文件。两样都不吃 `zip` feature，所以 `Cargo.toml`
#     至今 `default-features = false` —— 不必把历史上被 yank 过的 zip 请回来。
#     （另：zip 4.x 现已恢复可用，但没有理由为一个用不上的 feature 重新加依赖。）
#   - **Windows portable：不行。** 解压即用的裸包没有安装器身份，updater 只会调起
#     NSIS/MSI 安装器替换自己，portable 无此路可走。界面如实说「换 -setup.exe 安装版」。
#   - **Linux：没验过。** AppImage 那条走得通（没压缩的 ELF），但 deb 要 `dpkg -i`
#     提权；真机验收前不开，好过一个「点了报权限错」的按钮。
#
# 签名用的密钥对（minisign）**和 Apple / Windows 代码签名证书是两套完全独立的东西**
# —— 所以没有证书也能做自动更新。校验的是「这个包确实是我们发的」，不是「Apple 认识
# 我们」。剩下那条只能真机验的：**未签名的 macOS 应用替换 bundle 之后 Gatekeeper 会不会
# 拦**（见 docs/plan-round3.md 的 R5 一节）。
#
# `latest.json` **不用手工准备**：`tauri-action` 在 `createUpdaterArtifacts` 打开之后
# 会自动生成并随着产物一起传上去。但它的 `notes` 字段默认空 —— 末尾那个 `finalize`
# job 在所有平台传完之后把发布说明的「本次更新」段写进 notes，让客户端更新页的
# 「这次改了什么」有内容。放在矩阵**之后**是为了只有一个写入者，避免四个 job
# 并发覆盖 `latest.json`。
#
# 私钥在 `~/.tauri/signalhub-updater.key`（**绝不要提交进仓库**，也不要贴进任何对话
# 里），密码在旁边那个 `.password` 文件；两者只存在于本机 + 这个仓库的 GitHub Secret。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 先把发布建出来，**只跑一次**。
  #
  # 这一步单独拆出来是有原因的：三个构建 job 并行跑，每个都会去「没有就建一个」。
  # 两个 job 若几乎同时构建完，就会双双建出草稿 —— 于是同一个 tag 下出现两份发布、
  # 各挂一半产物（tauri-action 上游 #914 至今未修）。`retryAttempts` 救不了这个，
  # 因为那种情形压根不报错，只是多建了一个。把「创建」挪到矩阵外面，竞争就不存在。
  #
  # 版本号从 `tauri.conf.json` 读，和 tauri-action 替换 `__VERSION__` 用的是同一个
  # 来源 —— 两边算出不同的 tag 会建出一个没人往里传产物的空发布。
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.create.outputs.tag }}
      version: ${{ steps.create.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/github-script@v9
        id: create
        with:
          script: |
            const fs = require('fs');
            const conf = JSON.parse(
              fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'),
            );
            const tag = `v${conf.version}`;
            // 后面那个 portable 步骤要拿这两个值来命名和上传，所以一并输出
            core.setOutput('tag', tag);
            core.setOutput('version', conf.version);

            // 幂等：这个 tag 已经有发布就复用（重跑 workflow 走这条）。
            // listReleases 对有权写入的人是**包含草稿**的，所以草稿也认得出来。
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              core.info(`复用已有的发布 ${tag}（id ${existing.id}）`);
              return existing.id;
            }

            const body = fs.readFileSync('.github/release-body.md', 'utf8');
            const { data: created } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `SignalHub ${tag}`,
              body,
              // **草稿**：未签名的包先自己装一遍看看再公开。想打完就发布，改成 false。
              draft: true,
              prerelease: false,
            });
            core.info(`新建了发布 ${tag}（id ${created.id}）`);
            return created.id;

  build:
    needs: create-release
    # 建 Release、传产物都要写权限。仓库设置里 Actions 的 Workflow permissions 默认是
    # read，job 级的这一段会覆盖它 —— 不加就报 "Resource not accessible by integration"。
    permissions:
      contents: write

    strategy:
      # 一个平台挂了也让别的跑完 —— 想知道的是「哪几个平台有问题」
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 和 Intel 各打一份：一份 dmg 盖不住两种架构。第二行在
          # arm64 的 runner 上是交叉编译，靠 rust-toolchain 那步装上目标。
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Windows 只出 NSIS（`-setup.exe`），不出 WiX 的 `.msi` —— 见
          # `tauri.windows.conf.json` 里的说明：WiX 的 light.exe 在这一版配置上会
          # 失败，而 NSIS 那份本来就是 Tauri 推荐的 Windows 安装器。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Linux 只出 deb + AppImage。**不能用 `targets: "all"`**：那在 Linux 上
          # 还会带一个 rpm，而 `rpmbuild` 不在 runner 的默认镜像里（装了也得为它
          # 多维护一份依赖声明）。`bundle_args` 就是把这件事说死的地方。
          #
          # 钉 **22.04 而不是 `ubuntu-latest`**：产物的 glibc 下限跟着构建机走，
          # 在 24.04 上打出来的包装到 22.04 上会起不来（`GLIBC_2.39 not found`），
          # 而用 22.04 打出来的在更新的发行版上照样跑。**这是一条不能"顺手升级"
          # 的版本号。**
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 和 CI 保持一致（那边有说明）。打出来的包用不到这个 Node —— 它只负责
          # 跑 `npm ci` 和 vite 构建 —— 所以两边版本不同只会让人多一件事要想。
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri 打 dmg 走的是 `bundle_dmg.sh`，那个脚本要 `create-dmg` 这个第三方
      # 命令行工具。GitHub 的 macos runner 镜像里**碰巧**装了它，但那是镜像的实现
      # 细节，不是我们声明过的依赖 —— 镜像一升级就可能没掉，而这一步失败的报错是
      # `error running bundle_dmg.sh`，看不出缺的是哪个工具（本地就是这么栽的）。
      #
      # 显式装一次：已经装了的话 brew 会说 "already installed"，几秒钟的事；换来
      # 的是不管 runner 镜像怎么变，dmg 都打得出来。
      - name: 装 create-dmg（打 dmg 用）
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # Linux 上要一堆**系统库**，没有一个是 npm / cargo 能带进来的：webkit2gtk 是
      # WebView 本体，appindicator 是托盘，libxdo 是全局快捷键（那个插件在 X11 下
      # 靠它），librsvg 用来渲染图标，patchelf 是 AppImage 打包时改 rpath 用的。
      #
      # 照 Tauri 官方文档那份清单来，不多不少 —— 少一个的表现是构建到一半报一个
      # 和缺的库看不出关系的错（比如 pkg-config 找不到 webkit2gtk）。
      - name: 装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          # runner 的 DNS 偶尔抽风（2026-11-11：解析不到 azure.archive.ubuntu.com，
          # 默认配置一条条 URL 硬等，这一步跑了 67 分钟才失败）。加连接超时 +
          # 整轮重试；`ok` 标志是因为 Actions 的 bash 带 `-e`，`for` 里裸跑失败
          # 命令会直接中断，重试就轮不上了。
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          ok=0
          for i in 1 2 3; do
            if sudo apt-get "${APT_OPTS[@]}" update; then ok=1; break; fi
            echo "apt-get update 第 $i 次失败，10s 后重试"
            sleep 10
          done
          [ "$ok" = 1 ] || { echo "apt-get update 三次都失败"; exit 1; }
          sudo apt-get "${APT_OPTS[@]}" install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      # 只传 `releaseId`，**不传 `tagName`**：给了 releaseId 之后 tauri-action 会跳过
      # 「查找或创建发布」那一步，直接往这个 id 上传产物 —— 这正是上面那个 job 存在的
      # 意义。（两个都给的话，tagName 会被忽略，但少写一个少一处误解。）
      #
      # `args` 里那个 `--target` 会传给 tauri build，于是 `beforeBuildCommand` 跑
      # `scripts/stage-cli.mjs` 时能拿到同一个目标三元组，把 CLI 编译成**这份包对应
      # 架构**的 sidecar 放进 `src-tauri/binaries/`。sidecar 必须在打包前就在那儿
      # —— Tauri 只负责把它塞进包里，不会替你编译。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包（`.sig` + `latest.json`）的签名。**`createUpdaterArtifacts` 打开之后
          # 没有它 bundler 会直接失败** —— 这个 job 的每个 runner 都要，所以放在这里
          # 而不是某个 `if: runner.os == ...` 的分支里。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # `bundle_args` 只有 Linux 那行有，`|| ''` 让另外两行不必写一个空字段
          args: --target ${{ matrix.target }} ${{ matrix.bundle_args || '' }}

      # 免安装的 portable 包（解压即用，不需要安装器 / 管理员权限）。
      #
      # ⚠️ 别再写「不写注册表、不建快捷方式」：Windows 的原生通知要求应用有一个
      # 带 AppUserModelID 的开始菜单快捷方式（NSIS 安装器会建，portable 没有），
      # 所以应用首次启动会自己补一个 HKCU 键 + 一个当前用户开始菜单项，见
      # `src-tauri/src/win_toast.rs` 与 architecture.md §3.30。仍是免安装，但会
      # 在用户目录留下这两处状态。
      #
      # **必须把 CLI 一起打进去。** 应用会去找和它同目录的 `signalhub.exe`
      # （见 `hooks::resolve_hook_command` 的第二条路径），少了它「一键接入」写出来的
      # 命令就是一条跑不起来的东西 —— 而且静默失效。这两个文件正是 macOS 包里
      # `Contents/MacOS/` 下那两个，布局一致。
      #
      # 只装两个 exe 就够，是查过的：`webview2-com-sys` 在 msvc 目标上链的是
      # `WebView2LoaderStatic`（静态），所以 Tauri 2 的 Windows 应用是单文件，
      # 不需要额外的 `WebView2Loader.dll`。
      #
      # 产物落在 `target/<三元组>/release/` 下：app 由 Tauri 放那儿，CLI 由
      # `scripts/stage-cli.mjs` 用同一个三元组编到那儿。
      - name: 打 portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rel = "src-tauri/target/${{ matrix.target }}/release"
          $stage = "portable/SignalHub"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel/signalhub-app.exe" "$stage/"
          Copy-Item "$rel/signalhub.exe" "$stage/"

          $zip = "SignalHub_${{ needs.create-release.outputs.version }}_x64_portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          gh release upload "${{ needs.create-release.outputs.tag }}" $zip --clobber

  # 把发布说明写进 `latest.json` 的 `notes`，客户端更新页的「这次改了什么」才读得到。
  #
  # 为什么单独成 job 且 `needs: [build]`：tauri-action 在**每个**平台都会生成并上传
  # 一份 `latest.json`（内容是合并后的全平台清单），四个 job 并发写同一个资产。若把
  # 注入塞进 build 里，先写完的那份会被后上传的裸版本覆盖，notes 又空了。放在矩阵
  # 之后就只有一个写入者。
  finalize:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 把发布说明的「本次更新」段注入 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, urllib.request

          tag = os.environ["TAG"]
          # release-body.md 的格式是固定的：从「### 本次更新（x.y.z）」开始，
          # 到「### 安装」之前的「详见 … README」那段是给更新页看的正文。
          # 后面那两节（安装 / 命令行）是给网页发布页的，太长且不适合塞进小面板。
          body = pathlib.Path(".github/release-body.md").read_text(encoding="utf-8")
          start = body.find("### 本次更新")
          end = body.find("### 安装")
          if start == -1 or end == -1 or end < start:
              raise SystemExit("release-body.md 的段落标记变了，无法提取发布说明")
          notes = body[start:end].strip()
          # 去掉段尾那条「详见 architecture.md … README」——那是给发布页读者跳文档用的，
          # 更新面板里没有对应的入口语境。
          cut = notes.rfind("\n详见\n")
          if cut != -1:
              notes = notes[:cut].strip()

          # 通过 GitHub API 拿最新那份 latest.json（raw 地址带缓存，可能读到旧的）。
          req = urllib.request.Request(
              f"https://api.github.com/repos/iFishin/SignalHub/releases/tags/{tag}",
              headers={"Accept": "application/vnd.github+json",
                       "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "User-Agent": "signalhub-release-finalize"},
          )
          release = json.load(urllib.request.urlopen(req))
          asset = next((a for a in release["assets"] if a["name"] == "latest.json"), None)
          if asset is None:
              raise SystemExit("Release 里没有 latest.json，构建可能没上传更新包")

          req = urllib.request.Request(
              asset["url"],
              headers={"Accept": "application/octet-stream",
                       "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "User-Agent": "signalhub-release-finalize"},
          )
          manifest = json.load(urllib.request.urlopen(req))
          manifest["notes"] = notes
          pathlib.Path("latest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(f"latest.json 的 notes 已填：{len(notes)} 字符")

          # 同名资产先删再传：GitHub 不支持直接改资产内容。
          import subprocess
          subprocess.run(["gh", "release", "delete-asset", tag, "latest.json"], check=True)
          subprocess.run(
              ["gh", "release", "upload", tag, "latest.json", "--clobber"], check=True
          )
          PY
