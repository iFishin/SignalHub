name: Release

# 打一个 `v` 开头的 tag 就出四个平台的安装包。
#
# 为什么必须是四个 runner 而不是一台机器：**Tauri 不能交叉编译**。macOS 的
# `.app` / `.dmg` 只能在 macOS 上打，Windows 的 `-setup.exe` 只能在 Windows 上打，
# Linux 的 `.deb` / `.AppImage` 只能在 Linux 上打。所以「一次出多平台安装包」唯一
# 的路子是矩阵：每个平台各跑一台，产物汇到同一个 Release 里。
#
# Linux 那份**标 beta**（红线）：没在真机/真发行版上长期跑过，透明和置顶在 Wayland
# 下还可能得退回 X11 —— 用户能看到的那段说明在 `.github/release-body.md` 里。
#
# 现在**没有代码签名**（见 README 的「安装」一节）。macOS 上第一次打开会被 Gatekeeper
# 拦，Windows 上会被 SmartScreen 拦一道 —— 绕法写在 `.github/release-body.md` 里，
# 那份说明会被塞进发布页，用户看得到。
# 以后拿到证书，在下面 `tauri-action` 那一步前面补 codesign / notarytool / signtool
# 三步即可，其余不用动。
#
# ---- 自动更新：接了，但只有 macOS 真的能用（2026-10）-------------------------
#
# 五步都做完了（配置在 src-tauri 的四处：`Cargo.toml` 的依赖、`lib.rs` 的
# `.plugin()` 与三条命令、`tauri.conf.json` 的 `plugins.updater` +
# `createUpdaterArtifacts`、`capabilities/default.json` 的 `updater:default`）。
#
# **但只有 macOS 装得上。** 理由要分两半说，别把话说错：
#
#   - **Windows：上游这关过不去。** `tauri-plugin-updater` 的 `zip` feature 要求
#     `zip = "^4"`，而 2026-08 的 RUSTSEC-2025-0168（解包时路径规范化不当 → 任意写
#     文件）之后，crates.io 上**所有 zip ≤ 9.0.2 都被 yank 了**，只剩 9.0.3 / 9.0.4，
#     `^4` 无解 —— 带上这个 feature 连依赖都解析不出来（CI 会直接挂在 cargo fetch
#     上）。Windows 的更新包就是 `zip` 那种，所以那条路做不了。
#   - **Linux：做得通，但没验过。** `latest.json` 里 `linux-x86_64-appimage` 指的是
#     **没压缩的 ELF AppImage**（查过 v0.2.4 的实际产物），不吃 `zip` feature；
#     可是 deb 装的那份要靠 `dpkg -i` 提权（普通用户跑不动），而两条路都没在真机
#     验过 —— 先不开，好过一个「点了报权限错」的按钮。
#   - **macOS：完整可用。** 更新包 `.app.tar.gz` 只用 `flate2` + `tar`，这两个在插件
#     里是**非可选**依赖，和那个 feature 无关（含 minisign 验签）。
#
# 于是 `Cargo.toml` 里写的是 `default-features = false`，判据是 `update::SUPPORTED`
# （只有 macOS），界面在别的平台如实说「请手动下载」+ 给一个「打开发布页」。
# **上游把 zip 提到 ^9 之后**把那行 `default-features = false` 收回即可；**Linux 要
# 打开**则是把 `SUPPORTED` 改一行，但先把 AppImage / deb 两条路在真机上跑通。
#
# 签名用的密钥对（minisign）**和 Apple / Windows 代码签名证书是两套完全独立的东西**
# —— 所以没有证书也能做自动更新。校验的是「这个包确实是我们发的」，不是「Apple 认识
# 我们」。剩下那条只能真机验的：**未签名的 macOS 应用替换 bundle 之后 Gatekeeper 会不会
# 拦**（见 docs/plan-round3.md 的 R5 一节）。
#
# `latest.json` **不用手工准备**：`tauri-action` 在 `createUpdaterArtifacts` 打开之后
# 会自动生成并随着产物一起传上去。
#
# 私钥在 `~/.tauri/signalhub-updater.key`（**绝不要提交进仓库**，也不要贴进任何对话
# 里），密码在旁边那个 `.password` 文件；两者只存在于本机 + 这个仓库的 GitHub Secret。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # 先把发布建出来，**只跑一次**。
  #
  # 这一步单独拆出来是有原因的：三个构建 job 并行跑，每个都会去「没有就建一个」。
  # 两个 job 若几乎同时构建完，就会双双建出草稿 —— 于是同一个 tag 下出现两份发布、
  # 各挂一半产物（tauri-action 上游 #914 至今未修）。`retryAttempts` 救不了这个，
  # 因为那种情形压根不报错，只是多建了一个。把「创建」挪到矩阵外面，竞争就不存在。
  #
  # 版本号从 `tauri.conf.json` 读，和 tauri-action 替换 `__VERSION__` 用的是同一个
  # 来源 —— 两边算出不同的 tag 会建出一个没人往里传产物的空发布。
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      tag: ${{ steps.create.outputs.tag }}
      version: ${{ steps.create.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/github-script@v9
        id: create
        with:
          script: |
            const fs = require('fs');
            const conf = JSON.parse(
              fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'),
            );
            const tag = `v${conf.version}`;
            // 后面那个 portable 步骤要拿这两个值来命名和上传，所以一并输出
            core.setOutput('tag', tag);
            core.setOutput('version', conf.version);

            // 幂等：这个 tag 已经有发布就复用（重跑 workflow 走这条）。
            // listReleases 对有权写入的人是**包含草稿**的，所以草稿也认得出来。
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const existing = releases.find((r) => r.tag_name === tag);
            if (existing) {
              core.info(`复用已有的发布 ${tag}（id ${existing.id}）`);
              return existing.id;
            }

            const body = fs.readFileSync('.github/release-body.md', 'utf8');
            const { data: created } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `SignalHub ${tag}`,
              body,
              // **草稿**：未签名的包先自己装一遍看看再公开。想打完就发布，改成 false。
              draft: true,
              prerelease: false,
            });
            core.info(`新建了发布 ${tag}（id ${created.id}）`);
            return created.id;

  build:
    needs: create-release
    # 建 Release、传产物都要写权限。仓库设置里 Actions 的 Workflow permissions 默认是
    # read，job 级的这一段会覆盖它 —— 不加就报 "Resource not accessible by integration"。
    permissions:
      contents: write

    strategy:
      # 一个平台挂了也让别的跑完 —— 想知道的是「哪几个平台有问题」
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 和 Intel 各打一份：一份 dmg 盖不住两种架构。第二行在
          # arm64 的 runner 上是交叉编译，靠 rust-toolchain 那步装上目标。
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # Windows 只出 NSIS（`-setup.exe`），不出 WiX 的 `.msi` —— 见
          # `tauri.windows.conf.json` 里的说明：WiX 的 light.exe 在这一版配置上会
          # 失败，而 NSIS 那份本来就是 Tauri 推荐的 Windows 安装器。
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Linux 只出 deb + AppImage。**不能用 `targets: "all"`**：那在 Linux 上
          # 还会带一个 rpm，而 `rpmbuild` 不在 runner 的默认镜像里（装了也得为它
          # 多维护一份依赖声明）。`bundle_args` 就是把这件事说死的地方。
          #
          # 钉 **22.04 而不是 `ubuntu-latest`**：产物的 glibc 下限跟着构建机走，
          # 在 24.04 上打出来的包装到 22.04 上会起不来（`GLIBC_2.39 not found`），
          # 而用 22.04 打出来的在更新的发行版上照样跑。**这是一条不能"顺手升级"
          # 的版本号。**
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundle_args: --bundles deb,appimage

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 和 CI 保持一致（那边有说明）。打出来的包用不到这个 Node —— 它只负责
          # 跑 `npm ci` 和 vite 构建 —— 所以两边版本不同只会让人多一件事要想。
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Tauri 打 dmg 走的是 `bundle_dmg.sh`，那个脚本要 `create-dmg` 这个第三方
      # 命令行工具。GitHub 的 macos runner 镜像里**碰巧**装了它，但那是镜像的实现
      # 细节，不是我们声明过的依赖 —— 镜像一升级就可能没掉，而这一步失败的报错是
      # `error running bundle_dmg.sh`，看不出缺的是哪个工具（本地就是这么栽的）。
      #
      # 显式装一次：已经装了的话 brew 会说 "already installed"，几秒钟的事；换来
      # 的是不管 runner 镜像怎么变，dmg 都打得出来。
      - name: 装 create-dmg（打 dmg 用）
        if: runner.os == 'macOS'
        run: brew install create-dmg

      # Linux 上要一堆**系统库**，没有一个是 npm / cargo 能带进来的：webkit2gtk 是
      # WebView 本体，appindicator 是托盘，libxdo 是全局快捷键（那个插件在 X11 下
      # 靠它），librsvg 用来渲染图标，patchelf 是 AppImage 打包时改 rpath 用的。
      #
      # 照 Tauri 官方文档那份清单来，不多不少 —— 少一个的表现是构建到一半报一个
      # 和缺的库看不出关系的错（比如 pkg-config 找不到 webkit2gtk）。
      - name: 装 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      # 只传 `releaseId`，**不传 `tagName`**：给了 releaseId 之后 tauri-action 会跳过
      # 「查找或创建发布」那一步，直接往这个 id 上传产物 —— 这正是上面那个 job 存在的
      # 意义。（两个都给的话，tagName 会被忽略，但少写一个少一处误解。）
      #
      # `args` 里那个 `--target` 会传给 tauri build，于是 `beforeBuildCommand` 跑
      # `scripts/stage-cli.mjs` 时能拿到同一个目标三元组，把 CLI 编译成**这份包对应
      # 架构**的 sidecar 放进 `src-tauri/binaries/`。sidecar 必须在打包前就在那儿
      # —— Tauri 只负责把它塞进包里，不会替你编译。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新包（`.sig` + `latest.json`）的签名。**`createUpdaterArtifacts` 打开之后
          # 没有它 bundler 会直接失败** —— 这个 job 的每个 runner 都要，所以放在这里
          # 而不是某个 `if: runner.os == ...` 的分支里。
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # `bundle_args` 只有 Linux 那行有，`|| ''` 让另外两行不必写一个空字段
          args: --target ${{ matrix.target }} ${{ matrix.bundle_args || '' }}

      # 免安装的 portable 包（解压即用，不写注册表、不建开始菜单项）。
      #
      # **必须把 CLI 一起打进去。** 应用会去找和它同目录的 `signalhub.exe`
      # （见 `hooks::resolve_hook_command` 的第二条路径），少了它「一键接入」写出来的
      # 命令就是一条跑不起来的东西 —— 而且静默失效。这两个文件正是 macOS 包里
      # `Contents/MacOS/` 下那两个，布局一致。
      #
      # 只装两个 exe 就够，是查过的：`webview2-com-sys` 在 msvc 目标上链的是
      # `WebView2LoaderStatic`（静态），所以 Tauri 2 的 Windows 应用是单文件，
      # 不需要额外的 `WebView2Loader.dll`。
      #
      # 产物落在 `target/<三元组>/release/` 下：app 由 Tauri 放那儿，CLI 由
      # `scripts/stage-cli.mjs` 用同一个三元组编到那儿。
      - name: 打 portable zip
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rel = "src-tauri/target/${{ matrix.target }}/release"
          $stage = "portable/SignalHub"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$rel/signalhub-app.exe" "$stage/"
          Copy-Item "$rel/signalhub.exe" "$stage/"

          $zip = "SignalHub_${{ needs.create-release.outputs.version }}_x64_portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip
          gh release upload "${{ needs.create-release.outputs.tag }}" $zip --clobber
